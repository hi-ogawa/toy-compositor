<svg xmlns="http://www.w3.org/2000/svg" width="910" height="628" viewBox="0 0 910 628" role="img" aria-labelledby="title desc">
<title id="title">The filter graph of the synthetic sample</title>
<desc id="desc">Four inputs and a color source feed five filter chains, one row per layer. Input 0, the video, becomes stream v0 after fps, setpts, and scale. Input 1, the audio file, becomes a1 after aformat, two afades, and adelay. Input 2, the image, becomes v2 after scale and setpts. Input 3, the text PNG, becomes v3 after setpts. Layer 4, the translucent color, reads no input, and its color source filter becomes v4 after format and setpts. A color source filter also makes the canvas stream. Each overlay takes the stream from above as its background and the stream from the left as the foreground drawn at x and y: canvas with v0 makes over0, over0 with v2 makes over2, over2 with v3 makes over3, and over3 with v4 makes over4. format turns over4 into vout, and amix, apad, and atrim turn a1 into aout. The output maps vout and aout. Input 0's audio stream is unused because the video layer is muted.</desc>
<defs>
<marker id="pic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fb0"/></marker>
<marker id="snd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3641f"/></marker>
<marker id="nosrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c9691"/></marker>
</defs>
<rect width="910" height="628" fill="#fcfaf5"/>
<g font-family="Arial,sans-serif" font-size="14" fill="#263632">
<text x="20" y="34" font-size="20" font-weight="700">The synthetic sample's filter graph</text>
<g font-size="13" fill="#52625d">
<text x="20" y="66">Inputs and input options</text>
<text x="250" y="66">One chain per layer</text>
<text x="530" y="66">Stacking</text>
<text x="750" y="66">Sound</text>
</g>
<g font-family="Menlo,Consolas,monospace" font-size="12">
<!-- canvas -->
<rect x="530" y="80" width="180" height="48" rx="7" fill="#eef1ef" stroke="#7d8a84"/>
<text x="542" y="100">color 640×360 r=30 d=3</text>
<text x="542" y="118" fill="#52625d" font-family="Arial,sans-serif">source filter, no input</text>
<!-- row 0 video -->
<rect x="20" y="160" width="170" height="48" rx="7" fill="#ffffff" stroke="#a3b0a9"/>
<text x="32" y="180">0: video.mp4</text>
<text x="32" y="198" fill="#52625d">-ss 0 -t 3</text>
<rect x="250" y="160" width="220" height="48" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="262" y="180">fps=30, setpts,</text>
<text x="262" y="198">scale=640:360</text>
<rect x="530" y="160" width="180" height="48" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="542" y="180">overlay x=0 y=0</text>
<!-- row 1 audio -->
<rect x="20" y="236" width="170" height="48" rx="7" fill="#ffffff" stroke="#a3b0a9"/>
<text x="32" y="256">1: audio.wav</text>
<text x="32" y="274" fill="#52625d">-ss 0 -t 3</text>
<rect x="250" y="236" width="220" height="48" rx="7" fill="#faeee2" stroke="#b3641f"/>
<text x="262" y="256">aformat, afade in,</text>
<text x="262" y="274">afade out, adelay</text>
<rect x="750" y="236" width="140" height="48" rx="7" fill="#faeee2" stroke="#b3641f"/>
<text x="762" y="256">amix, apad,</text>
<text x="762" y="274">atrim=0:3</text>
<!-- row 2 image -->
<rect x="20" y="312" width="170" height="48" rx="7" fill="#ffffff" stroke="#a3b0a9"/>
<text x="32" y="332">2: image.png</text>
<text x="32" y="350" fill="#52625d">-loop 1 -t 3</text>
<rect x="250" y="312" width="220" height="48" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="262" y="332">scale=160:90,</text>
<text x="262" y="350">setpts</text>
<rect x="530" y="312" width="180" height="48" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="542" y="332">overlay x=420 y=240</text>
<!-- row 3 text -->
<rect x="20" y="388" width="170" height="48" rx="7" fill="#ffffff" stroke="#a3b0a9"/>
<text x="32" y="408">3: text PNG</text>
<text x="32" y="426" fill="#52625d">-loop 1 -t 3</text>
<rect x="250" y="388" width="220" height="48" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="262" y="408">setpts</text>
<rect x="530" y="388" width="180" height="48" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="542" y="408">overlay x=420 y=259</text>
<!-- row 4 color -->
<rect x="20" y="464" width="170" height="48" rx="7" fill="none" stroke="#a3b0a9" stroke-dasharray="4 3"/>
<text x="32" y="484" fill="#8c9691">4: color layer</text>
<text x="32" y="502" fill="#8c9691" font-family="Arial,sans-serif">no input, source filter</text>
<rect x="250" y="464" width="220" height="48" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="262" y="484">color #0080ff@0.5 240×135,</text>
<text x="262" y="502">format=rgba, setpts</text>
<rect x="530" y="464" width="180" height="48" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="542" y="484">overlay x=40 y=100</text>
<!-- outputs -->
<rect x="530" y="536" width="192" height="40" rx="7" fill="#eef1ef" stroke="#7d8a84"/>
<text x="542" y="561">format=yuv420p → [vout]</text>
<rect x="750" y="536" width="140" height="40" rx="7" fill="#eef1ef" stroke="#7d8a84"/>
<text x="762" y="561">-map [aout]</text>
<!-- edge labels -->
<g fill="#2f6fb0">
<text x="200" y="178">[0:v]</text>
<text x="480" y="178">[v0]</text>
<text x="200" y="330">[2:v]</text>
<text x="480" y="330">[v2]</text>
<text x="200" y="406">[3:v]</text>
<text x="480" y="406">[v3]</text>
<text x="628" y="148">[canvas]</text>
<text x="628" y="228">[over0]</text>
<text x="628" y="380">[over2]</text>
<text x="628" y="452">[over3]</text>
<text x="480" y="482">[v4]</text>
<text x="628" y="528">[over4]</text>
</g>
<g fill="#b3641f">
<text x="200" y="254">[1:a]</text>
<text x="480" y="254">[a1]</text>
<text x="828" y="528">[aout]</text>
</g>
</g>
<text x="542" y="198" font-size="12" fill="#52625d">[canvas] behind, [v0] on top</text>
<text x="542" y="350" font-size="12" fill="#52625d">[over0] behind, [v2] on top</text>
<text x="542" y="426" font-size="12" fill="#52625d">[over2] behind, [v3] on top</text>
<text x="542" y="502" font-size="12" fill="#52625d">[over3] behind, [v4] on top</text>
<text x="32" y="226" font-size="12" fill="#8c9691">[0:a] unused, the layer is muted</text>
<!-- edges -->
<path d="M190 184 H248" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M470 184 H528" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M190 336 H248" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M470 336 H528" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M190 412 H248" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M470 412 H528" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M620 128 V158" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M620 208 V310" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M620 360 V386" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M620 436 V462" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M190 488 H248" fill="none" stroke="#8c9691" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#nosrc)"/>
<path d="M470 488 H528" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M620 512 V534" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M190 260 H248" fill="none" stroke="#b3641f" stroke-width="1.5" marker-end="url(#snd)"/>
<path d="M470 260 H748" fill="none" stroke="#b3641f" stroke-width="1.5" marker-end="url(#snd)"/>
<path d="M820 284 V534" fill="none" stroke="#b3641f" stroke-width="1.5" marker-end="url(#snd)"/>
<text x="20" y="598" font-size="12" fill="#52625d">Boxes are inputs or filter chains, and arrows are streams named by their label. Each overlay draws the stream from the left over the one from above,</text>
<text x="20" y="616" font-size="12" fill="#52625d">and -map [vout] and -map [aout] pick the streams the output file encodes.</text>
</g>
</svg>
