<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">Pictures stack over a canvas in layer order, and sounds are mixed</title>
<desc id="desc">A solid canvas starts the picture chain. Each layer that has a picture is overlaid on the result so far at its position, in layer order, so later layers sit on top. A muted video contributes only a picture, and an audio layer contributes only a sound. Sounds go to one mix that is padded to the output length. The chain ends in the output picture, and the mix in the output sound.</desc>
<defs>
<marker id="pic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fb0"/></marker>
<marker id="snd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3641f"/></marker>
<marker id="base" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8a84"/></marker>
</defs>
<rect width="760" height="420" fill="#fcfaf5"/>
<g font-family="Arial,sans-serif" font-size="15" fill="#263632">
<text x="30" y="34" font-size="20" font-weight="700">Stack pictures in layer order, mix sounds</text>
<text x="30" y="72" font-size="13" fill="#52625d">Layers, in order</text>
<text x="300" y="72" font-size="13" fill="#52625d">Picture chain</text>
<text x="560" y="72" font-size="13" fill="#52625d">Sound</text>
<rect x="300" y="84" width="200" height="40" rx="7" fill="#eef1ef" stroke="#7d8a84"/>
<text x="400" y="109" text-anchor="middle">Solid canvas</text>
<rect x="30" y="144" width="200" height="40" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="42" y="169">1. Video (muted)</text>
<rect x="300" y="144" width="200" height="40" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="400" y="169" text-anchor="middle">Overlay at its box</text>
<rect x="30" y="204" width="200" height="40" rx="7" fill="#faeee2" stroke="#b3641f"/>
<text x="42" y="229">2. Audio</text>
<rect x="540" y="204" width="190" height="40" rx="7" fill="#faeee2" stroke="#b3641f"/>
<text x="635" y="229" text-anchor="middle">Mix, pad to length</text>
<rect x="30" y="264" width="200" height="40" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="42" y="289">3. Image</text>
<rect x="300" y="264" width="200" height="40" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="400" y="289" text-anchor="middle">Overlay at its box</text>
<rect x="30" y="324" width="200" height="40" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="42" y="349">4. Text</text>
<rect x="300" y="324" width="200" height="40" rx="7" fill="#e7eff8" stroke="#2f6fb0"/>
<text x="400" y="349" text-anchor="middle">Overlay at its box</text>
<rect x="300" y="378" width="200" height="34" rx="7" fill="#eef1ef" stroke="#7d8a84"/>
<text x="400" y="400" text-anchor="middle">Output picture</text>
<rect x="540" y="378" width="190" height="34" rx="7" fill="#eef1ef" stroke="#7d8a84"/>
<text x="635" y="400" text-anchor="middle">Output sound</text>
<path d="M230 164 H298" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M230 284 H298" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M230 344 H298" fill="none" stroke="#2f6fb0" stroke-width="1.5" marker-end="url(#pic)"/>
<path d="M230 224 H538" fill="none" stroke="#b3641f" stroke-width="1.5" marker-end="url(#snd)"/>
<path d="M460 124 V142" fill="none" stroke="#7d8a84" stroke-width="1.5" marker-end="url(#base)"/>
<path d="M460 184 V262" fill="none" stroke="#7d8a84" stroke-width="1.5" marker-end="url(#base)"/>
<path d="M460 304 V322" fill="none" stroke="#7d8a84" stroke-width="1.5" marker-end="url(#base)"/>
<path d="M460 364 V376" fill="none" stroke="#7d8a84" stroke-width="1.5" marker-end="url(#base)"/>
<path d="M635 244 V376" fill="none" stroke="#b3641f" stroke-width="1.5" marker-end="url(#snd)"/>
<text x="468" y="202" font-size="12" fill="#52625d">result so far</text>
</g>
</svg>
