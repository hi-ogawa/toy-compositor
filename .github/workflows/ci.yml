name: ci
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - run: corepack enable
      - run: pnpm i
      - run: pnpm lint-check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - run: corepack enable
      - run: pnpm i
      - run: .github/scripts/install-ffmpeg.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: test-results/
          retention-days: 7
